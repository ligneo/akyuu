name: Packages
on:
  push:
    branches: [development]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install Qt
        shell: pwsh
        run: |
          # Qt 6.11 moved the Windows repository; use the merged upstream fix.
          python -m pip install git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 --outputdir C:/Qt
      - name: Build and test
        shell: pwsh
        run: |
          $qt = 'C:/Qt/6.11.2/msvc2022_64'
          $env:PATH = "$qt/bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$qt -DAKYUU_PORTABLE=OFF -DAKYUU_BUILD_TESTS=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/bin"
          if ($LASTEXITCODE) { throw 'CMake failed.' }
          cmake --build build --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed.' }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { throw 'Tests failed.' }
      - name: Prepare licenses
        shell: pwsh
        run: |
          $url = 'https://github.com/ligneo/akyuu/releases/download/v0.1.0-beta.3/akyuu-0.1.0-beta.3-third-party-sources.tar'
          Invoke-WebRequest $url -OutFile sources.tar
          if ((Get-FileHash sources.tar -Algorithm SHA256).Hash.ToLower() -ne 'f8f33db2e8dd807cc094b9820a34acc21ac8c88c14987a98e6318f21e22a7d95') { throw 'Source archive checksum mismatch.' }
          tar -xf sources.tar
          if (-not (Test-Path licenses/NOTICE)) { throw 'Missing license payload.' }
          Set-Content licenses/NOTICE 'Akyuu uses Qt 6.11.2. Qt and its third-party sources and full licenses accompany the release. The Windows compiler runtime is the official Microsoft Visual C++ Redistributable, distributed under its included license.'
      - name: Package and test installed application
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 -Build "$PWD/build" -Qt C:/Qt/6.11.2/msvc2022_64 -Licenses "$PWD/licenses" -Output "$PWD/packages"
          ./tools/test-windows-package.ps1 -Installer (Get-ChildItem packages/*-setup.exe).FullName -Probe "$PWD/build/tests/akyuu-deployment-tests.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-packages
          path: packages/*-setup.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare SDK image
        run: docker build -f setup/linux/Dockerfile -t akyuu-build .
      - name: Build packages
        run: docker run --rm -v "$PWD:/work" akyuu-build bash tools/build-linux-packages.sh /work/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-packages
          path: |
            packages/*.AppImage
            packages/*.deb
            packages/*.rpm
            packages/*-source.tar.xz
            packages/*-third-party-sources.tar
            packages/diagnostics/
            packages/fixtures/
          if-no-files-found: error
  install-linux:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            format: deb
            name: ubuntu
          - image: debian:13
            format: deb
            name: debian
          - image: registry.fedoraproject.org/fedora:44
            format: rpm
            name: fedora
          - image: registry.opensuse.org/opensuse/leap:16.0
            format: rpm
            name: opensuse
    container: ${{ matrix.image }}
    steps:
      - name: Install test tools
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git xvfb xauth
          elif command -v dnf >/dev/null; then
            dnf install -y git xorg-x11-server-Xvfb xauth
          else
            zypper --non-interactive install git xorg-x11-server-Xvfb xauth
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Install, upgrade, run and remove
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
        run: tools/test-linux-package.sh "$FORMAT" packages

  arch:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm git python cmake ninja qt6-base qt6-svg qt6-multimedia qt6-tools systemd-libs hicolor-icon-theme
          useradd --create-home builder
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Build and test package
        run: |
          chown -R builder:builder .
          runuser -u builder -- tools/package-arch.sh "$(find packages -maxdepth 1 -name '*-source.tar.xz')" packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch-packages
          path: |
            packages/*.pkg.tar.zst
            packages/PKGBUILD
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, install-linux, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-packages'
          path: packages
          merge-multiple: true
      - name: Prepare checked release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/create-release-draft.sh "$GITHUB_REF_NAME" packages
