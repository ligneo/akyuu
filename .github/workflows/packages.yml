name: Packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Package jobs to run
        type: choice
        options: [all, nix, packages]
        default: all
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nix:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - name: Build and test Nix package
        run: nix flake check --no-update-lock-file --max-jobs 1 --cores 2 -L
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'nix'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: nu {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7
        with:
          version: '0.116.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install Qt SDK
        run: nu --no-config-file tools/ci.nu windows-sdk
      - name: Build and test
        run: nu --no-config-file tools/ci.nu windows-build
      - name: Package and test installed application
        run: nu --no-config-file tools/ci.nu windows-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-packages
          path: packages/*-setup.exe
          if-no-files-found: error
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'nix'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7
        with:
          version: '0.116.0'
      - name: Prepare SDK image and build packages
        shell: nu {0}
        run: nu --no-config-file tools/ci.nu linux-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-packages
          path: |
            packages/*.AppImage
            packages/*.deb
            packages/*.rpm
            packages/*-source.tar.xz
            packages/*-third-party-sources.tar
            packages/diagnostics/
            packages/fixtures/
          if-no-files-found: error
  install-linux:
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            format: deb
            name: ubuntu
          - image: debian:13
            format: deb
            name: debian
          - image: registry.fedoraproject.org/fedora:44
            format: rpm
            name: fedora
          - image: registry.opensuse.org/opensuse/leap:16.0
            format: rpm
            name: opensuse
    container: ${{ matrix.image }}
    steps:
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7
        with:
          version: '0.116.0'
      - name: Install test tools
        shell: nu {0}
        run: |
          def --wrapped checked [program: string, ...arguments: string] {
            ^$program ...$arguments
            if $env.LAST_EXIT_CODE != 0 { error make {msg: $"($program) failed"} }
          }
          if not (which apt-get | is-empty) {
            checked apt-get update
            checked apt-get install -y --no-install-recommends ca-certificates git xvfb xauth
          } else if not (which dnf | is-empty) {
            checked dnf install -y git xorg-x11-server-Xvfb xauth
          } else {
            checked zypper --non-interactive install git xorg-x11-server-Xvfb xauth
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Install, upgrade, run and remove
        shell: nu {0}
        env:
          FORMAT: ${{ matrix.format }}
        run: nu --no-config-file tools/ci.nu test-linux
  arch:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7
        with:
          version: '0.116.0'
      - name: Install build dependencies
        shell: nu {0}
        run: |
          ^pacman -Syu --noconfirm git cmake ninja qt6-base qt6-svg qt6-multimedia qt6-tools systemd-libs hicolor-icon-theme
          if $env.LAST_EXIT_CODE != 0 { error make {msg: 'Installing Arch build dependencies failed.'} }
          ^useradd --create-home builder
          if $env.LAST_EXIT_CODE != 0 { error make {msg: 'Creating the build user failed.'} }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-packages
          path: packages
      - name: Build and test package
        shell: nu {0}
        run: nu --no-config-file tools/ci.nu arch-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch-packages
          path: |
            packages/*.pkg.tar.zst
            packages/PKGBUILD
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, install-linux, arch, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7
        with:
          version: '0.116.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-packages'
          path: packages
          merge-multiple: true
      - name: Prepare checked release draft
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu --no-config-file tools/ci.nu release-draft
